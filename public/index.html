<style>
  :root {
    --green-900:#16332A; --green-700:#1F4A3D; --green-600:#2C6350;
    --gold-500:#E3A857; --teal-500:#2E9B8F;
    --ink:#201C16; --paper:#FFFDF9; --paper-dim:#F2EFE7; --line:#E3DFD3; --muted:#8A8474;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: linear-gradient(160deg, var(--green-900), var(--green-700) 60%, var(--green-600));
    font-family: var(--font-body); padding: 24px; text-align:center;
  }
  .brand { font-family: var(--font-display); font-weight:700; font-size:1.8rem; color:var(--paper); margin-bottom:4px; animation: fadeIn .5s var(--ease) both; }
  .brand span { color: var(--gold-500); }
  .tagline { color: rgba(255,255,255,0.65); font-size:0.9rem; margin-bottom: 40px; animation: fadeIn .5s .1s var(--ease) both; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:translateY(0);} }

  .roles { display:flex; flex-direction:column; gap:14px; width:100%; max-width:340px; }
  .role-card {
    background: var(--paper); border-radius:16px; padding:20px 22px; text-decoration:none; color:var(--ink);
    display:flex; align-items:center; gap:16px; text-align:left;
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
    animation: cardIn .5s var(--ease) both;
  }
  .role-card:nth-child(1) { animation-delay: .15s; }
  .role-card:nth-child(2) { animation-delay: .25s; }
  .role-card:nth-child(3) { animation-delay: .35s; }
  @keyframes cardIn { from { opacity:0; transform:translateY(14px);} to { opacity:1; transform:translateY(0);} }
  .role-card:hover { transform:translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
  .role-card:active { transform:scale(0.98); }
  .role-icon { width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; }
  .role-card.student .role-icon { background: rgba(31,74,61,0.1); }
  .role-card.kitchen .role-icon { background: rgba(227,168,87,0.15); }
  .role-card.admin .role-icon { background: rgba(46,155,143,0.12); }
  .role-title { font-family: var(--font-display); font-weight:700; font-size:1rem; }
  .role-sub { font-size:0.8rem; color:var(--muted); margin-top:2px; }

  footer { margin-top: 36px; color: rgba(255,255,255,0.4); font-size: 0.75rem; animation: fadeIn .5s .45s var(--ease) both; }
</style>
</head>
<body>
  <div class="brand">Busitema <span>Restaurant</span></div>
  <div class="tagline">Skip the line. Order ahead.</div>

  <div class="roles">
    <a class="role-card student" href="/student.html">
      <div class="role-icon">🎓</div>
      <div>
        <div class="role-title">I'm a Student</div>
        <div class="role-sub">Order food, or check out as a guest</div>
      </div>
    </a>
    <a class="role-card kitchen" href="/kitchen.html">
      <div class="role-icon">👨‍🍳</div>
      <div>
        <div class="role-title">I'm Kitchen Staff</div>
        <div class="role-sub">View and prepare live orders</div>
      </div>
    </a>
    <a class="role-card admin" href="/admin.html">
      <div class="role-icon">📊</div>
      <div>
        <div class="role-title">I'm an Admin</div>
        <div class="role-sub">Menu, transactions, disputes, staff</div>
      </div>
    </a>
  </div>

  <footer>Busitema University</footer>
</body>
</html>
