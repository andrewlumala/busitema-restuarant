version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: busitema_canteen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Files in this folder run automatically, in filename order, the FIRST time
      # the database is created — so schema loads before seed data.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: busitema_canteen
      JWT_SECRET: local-dev-secret-change-in-production
      PORT: 4000
      FRONTEND_URL: ""
      MOMO_WEBHOOK_SECRET: ""
      SMS_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
